name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  perl:
    name: ${{ matrix.os }} / Perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, perl: '5.20'}
          - {os: ubuntu-latest, perl: '5.34'}
          - {os: ubuntu-latest, perl: '5.40'}
          - {os: ubuntu-latest, perl: '5.44'}
          - {os: macos-latest, perl: '5.40'}
          # Upstream's default 5.40 Windows build has an incompatible XS import library.
          # Keep Windows coverage with a coherent Strawberry interpreter/toolchain.
          - {os: windows-latest, perl: '5.40', distribution: strawberry}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution || 'default' }}
      - name: Install build prerequisites
        run: |
          cpanm --notest --skip-satisfied 'ExtUtils::MakeMaker~7.22' 'Storable~3.41' 'Digest::SHA~5.96'
          cpanm --notest --installdeps .
          perl -MExtUtils::MakeMaker=7.22 -MStorable=3.41 -MDigest::SHA=5.96 -MEncode=3.12 -MCwd=3.65 -e 'print "Native dependencies load correctly\n"'
      - name: Configure and test
        env:
          HARNESS_PERL_SWITCHES: -Mwarnings=FATAL,all
        run: |
          perl Makefile.PL
          make
          make test
          perl -Ilib examples/run-all.pl
      - name: Installed command and launcher
        run: perl maint/check-cli-install.pl "cli-install tools" --build
  integration:
    name: Actual CW and RTTY codecs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gipidevdor/ham-cw
          ref: ba5139b872a88f78ed9c6179be0947ba0f62fab5
          path: .author/ham-cw
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gipidevdor/ham-rtty
          ref: 2df0eae1d22b0fb4b59655499915ec2553ed8d55
          path: .author/ham-rtty
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.40'
      - name: Test both real codecs without PDL
        env:
          PERL5LIB: lib:.author/ham-cw/lib:.author/ham-rtty/lib
          HARNESS_PERL_SWITCHES: -Mwarnings=FATAL,all
        run: |
          cpanm --notest 'Storable~3.41' 'Encode~3.12'
          perl -MHam::CW -MHam::RTTY -e 'die "PDL loaded" if $INC{"PDL.pm"}'
          prove -lr t
  author:
    name: Author checks and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gipidevdor/ham-cw
          ref: ba5139b872a88f78ed9c6179be0947ba0f62fab5
          path: .author/ham-cw
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gipidevdor/ham-rtty
          ref: 2df0eae1d22b0fb4b59655499915ec2553ed8d55
          path: .author/ham-rtty
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.40'
      - name: Install author tools
        run: |
          cpanm --notest Perl::Tidy@20260826 'Encode~3.12'
          cpanm --notest --installdeps --with-develop .
      - name: Build, POD, metadata, documentation and style
        env:
          PERL5LIB: lib:.author/ham-cw/lib:.author/ham-rtty/lib
        run: |
          perl Makefile.PL
          make
          make test
          make distmeta
          prove -lr xt
      - name: Coverage gates
        env:
          PERL5LIB: lib:.author/ham-cw/lib:.author/ham-rtty/lib
          HARNESS_PERL_SWITCHES: -MDevel::Cover=-db,cover_db,-blib,0,-coverage,statement,branch,condition,-select,lib/Ham/QSO,-ignore,^t/
        run: prove -lr t
      - name: Check measured coverage
        run: perl maint/coverage.pl cover_db
      - name: Test release archive and isolated installation
        run: |
          make distcheck
          make disttest
          make dist
          perl maint/check-dist.pl Ham-QSO-0.001.tar.gz
          perl maint/check-install.pl Ham-QSO-0.001.tar.gz
